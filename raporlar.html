<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raporlar - SkyOps</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .report-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            height: 100%;
        }
        .report-header {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .route-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8fafc;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        .route-rank {
            width: 25px;
            height: 25px;
            background: #3b82f6;
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin-right: 10px;
        }
        .route-count {
            background: #e0f2fe;
            color: #0284c7;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        /* =========================
   PDF SAYFA KIRILMA DÜZELTME
   ========================= */

@media print {
    #pdfExportArea {
        page-break-inside: avoid;
    }

    .report-card {
        page-break-inside: avoid;
        break-inside: avoid;
    }

    .row {
        page-break-inside: avoid;
        break-inside: avoid;
    }

    canvas {
        page-break-inside: avoid;
        break-inside: avoid;
    }
}
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo"><i class="fas fa-plane-departure"></i> SkyOps</div>
            <div class="brand-subtitle">Operasyon Yönetimi</div>
        </div>
        <div class="sidebar-divider"></div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-th-large"></i> <span>Genel Bakış</span></a></li>
            <li><a href="ucus.html"><i class="fas fa-plane"></i> <span>Uçuş Yönetimi</span></a></li>
            <li><a href="personel.html"><i class="fas fa-users-cog"></i> <span>Personel Planlama</span></a></li>
            <li><a href="#" class="active"><i class="fas fa-chart-pie"></i> <span>Raporlar</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="#" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Çıkış Yap</a>
        </div>
    </nav>

    <main class="main-content">
        <header class="topbar">
            <div class="page-info">
                <h1 class="page-title">İstatistik ve Raporlar</h1>
                <p class="page-desc">Operasyonel verilerin analizi ve dönemsel özetler.</p>
            </div>
            <div class="topbar-actions">
                <button id="downloadPdfBtn" class="btn btn-danger text-white rounded-pill px-4 fw-bold shadow-sm d-flex align-items-center gap-2">
                    <i class="fas fa-file-pdf"></i> PDF Olarak İndir
                </button>
            </div>
        </header>

        <div id="pdfExportArea">
            <div class="row g-4 mb-4">
                
                <div class="col-md-6">
                    <div class="report-card">
                        <div class="report-header">
                            <i class="fas fa-chart-pie text-primary"></i> Uçuş Performans Analizi
                        </div>
                        <div style="height: 300px; display: flex; justify-content: center;">
                            <canvas id="flightPerformanceChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="report-card">
                        <div class="report-header">
                            <i class="fas fa-battery-half text-warning"></i> Personel Yorgunluk Dağılımı
                        </div>
                        <div style="height: 300px;">
                            <canvas id="fatigueDistributionChart"></canvas>
                        </div>
                    </div>
                </div>

            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-12">
                    <div class="report-card">
                        <div class="report-header">
                            <i class="fas fa-route text-success"></i> En Çok Uçulan İlk 5 Rota
                        </div>
                        <div id="topRoutesList" class="mt-3">
                            <div class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin me-2"></i>Rotalar analiz ediliyor...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script src="raporlar.js"></script>
</body>
</html>
