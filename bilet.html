<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biletlerim - SkyOps</title>
    <script>
        if (sessionStorage.getItem("isLoggedIn") !== "true" || sessionStorage.getItem("userRole") !== "passenger") {
            window.location.replace("login.html");
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Libre+Barcode+128&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; padding-bottom: 50px; }
        .navbar-brand { font-weight: 800; color: #1e293b !important; }
        .navbar-brand i { color: #3b82f6; }

        /* Biniş Kartı Konteynırı */
        #ticketContainer { max-width: 900px; margin: 40px auto; }

        /* Boarding Pass Tasarımı */
        .boarding-pass {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            position: relative;
        }

        /* Sol Ana Bölüm */
        .pass-main { flex: 3; padding: 30px; border-right: 2px dashed #e2e8f0; position: relative; }
        
        /* Sağ Koparılan Bölüm (Stub) */
        .pass-stub { flex: 1; padding: 30px; background-color: #f8fafc; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }

        /* Tasarım Detayları */
        .pass-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .pnr-box { background: #3b82f6; color: white; padding: 5px 15px; border-radius: 8px; font-weight: 700; font-family: monospace; }
        
        .flight-route { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .route-point h2 { font-weight: 800; margin-bottom: 0; color: #0f172a; }
        .route-point span { font-size: 0.85rem; color: #64748b; font-weight: 500; }
        .plane-icon { color: #cbd5e1; font-size: 1.5rem; }

        .pass-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 25px; }
        .detail-item label { display: block; font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
        .detail-item p { font-weight: 700; color: #334155; margin-bottom: 0; }

        /* Barkod Bölümü */
        .barcode { font-family: 'Libre Barcode 128', cursive; font-size: 4rem; color: #0f172a; margin-top: 15px; }
        
        /* Makas Kesik Efekti */
        .boarding-pass::before, .boarding-pass::after {
            content: ''; position: absolute; width: 30px; height: 30px; background-color: #f1f5f9; border-radius: 50%; right: calc(25% - 15px); z-index: 2;
        }
        .boarding-pass::before { top: -15px; }
        .boarding-pass::after { bottom: -15px; }

        .btn-print { border-radius: 12px; font-weight: 600; padding: 12px 25px; transition: all 0.3s; }
        .empty-state { text-align: center; padding: 100px 20px; }

        /* --- YAZDIRMA (PRINT) STİLLERİ --- */
        @media print {
            /* Yazdırma anında sayfadaki her şeyi gizle */
            body * {
                visibility: hidden;
            }
            
            /* Sadece .print-section sınıfına sahip bileti ve içindekileri göster */
            .print-section, .print-section * {
                visibility: visible;
            }
            
            /* Yazdırılacak bileti sayfanın en üst köşesine yerleştir */
            .print-section {
                position: absolute !important;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                box-shadow: none !important; /* Çıktıda gölge kötü durur, kaldıralım */
            }

            /* Yazdırılan biletin içindeki "Yazdır" butonunu PDF'te gizle */
            .print-section .btn-light {
                display: none !important;
            }

            /* Dil butonlarının aktif halini belirginleştir */
#btnLangTR.active, #btnLangEN.active {
    background-color: #3b82f6 !important;
    color: #ffffff !important;
}
#btnLangTR, #btnLangEN {
    border: none;
    background: transparent;
    color: #64748b;
}
        }

    </style>
</head>
<body>

<nav class="navbar bg-white shadow-sm py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fs-4 fw-bolder text-dark" href="yolcu.html"><i class="fas fa-plane me-2 text-primary"></i>SkyOps</a>
        
        <div class="d-flex align-items-center gap-2">
            <a href="yolcu.html" class="btn btn-light rounded-pill fw-semibold px-3" data-i18n="newTicket">Yeni Bilet Al</a>
            <button class="btn btn-outline-danger rounded-pill fw-semibold px-3" onclick="clearTickets()" data-i18n="clearMemory">Hafızayı Temizle</button>
            
            <div class="dropdown">
                <button class="btn btn-light rounded-pill dropdown-toggle fw-bold border shadow-sm px-3" type="button" data-bs-toggle="dropdown">
                    <i class="fas fa-user-circle text-primary me-1 fs-5 align-middle"></i> 
                    <span id="navPassengerName">Yolcu</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2" style="border-radius: 12px;">
                    <li><h6 class="dropdown-header text-muted" data-i18n="myAccount">Hesabım</h6></li>
                    <li><a class="dropdown-item fw-medium py-2" href="#" id="btnProfileEdit"><i class="fas fa-user-edit me-2 text-secondary"></i><span data-i18n="editProfile">Profili Düzenle</span></a></li>
                    <li><a class="dropdown-item fw-medium py-2" href="#" id="btnUserSettings"><i class="fas fa-cog me-2 text-secondary"></i><span data-i18n="settings">Ayarlar</span></a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item fw-bold text-danger py-2" href="#" id="btnLogout"><i class="fas fa-sign-out-alt me-2"></i><span data-i18n="logout">Çıkış Yap</span></a></li>
                </ul>
            </div>

            <div class="d-flex bg-white border rounded-pill shadow-sm p-1">
                <button id="btnLangTR" class="btn btn-sm rounded-pill px-2 fw-bold active" style="font-size: 0.8rem;">TR</button>
                <button id="btnLangEN" class="btn btn-sm rounded-pill px-2 fw-bold" style="font-size: 0.8rem;">EN</button>
            </div>
        </div>
    </div>
</nav>

    <div class="container">
        <div id="ticketContainer">
            <div class="text-center mt-5">
                <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
                <p class="mt-3 text-muted">Biletleriniz hazırlanıyor...</p>
            </div>
        </div>
    </div>

 <div class="modal fade" id="logoutConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow" style="border-radius: 16px;">
                <div class="modal-body text-center p-4">
                    <div class="mb-3">
                        <i class="fas fa-sign-out-alt fa-3x text-danger opacity-75"></i>
                    </div>
                    <h5 class="fw-bold mb-2">Çıkış Yapılıyor</h5>
                    <p class="text-muted mb-4">Hesabınızdan çıkış yapmak istediğinize emin misiniz?</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-light fw-semibold px-4" data-bs-dismiss="modal">İptal</button>
                        <button type="button" class="btn btn-danger fw-semibold px-4" id="btnConfirmLogout">Çıkış Yap</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<div class="modal fade" id="passengerProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
                <div class="modal-header border-0 bg-white pb-0 mt-2 px-4">
                    <h4 class="modal-title fw-bold text-dark d-flex align-items-center">
                        <i class="fas fa-user-edit text-primary me-2"></i> <span data-i18n="profileTitle">Profil Bilgilerim</span>
                    </h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4 pt-3">
                    <form id="passengerProfileForm">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold mb-1" data-i18n="fullNameLabel">Ad Soyad</label>
                            <input type="text" class="form-control form-control-lg border-1 bg-light" id="profileEditName" required style="border-radius: 10px; font-size: 15px;">
                        </div>
                        <div class="mb-2">
                            <label class="form-label text-secondary small fw-bold mb-1" data-i18n="emailLabel">E-posta Adresi (Giriş ID)</label>
                            <input type="email" class="form-control form-control-lg border-1 bg-light" id="profileEditEmail" disabled style="border-radius: 10px; font-size: 15px;">
                            <small class="text-danger mt-1 d-block" style="font-size: 12px;" data-i18n="emailWarning">* Güvenlik gereği E-posta adresi değiştirilemez.</small>
                        </div>
                        <div class="mb-4 mt-3">
                            <label class="form-label text-secondary small fw-bold mb-1" data-i18n="newPasswordLabel">Yeni Şifre Belirle (İsteğe Bağlı)</label>
                            <input type="password" class="form-control form-control-lg border-1 bg-light" id="profileEditPassword" data-i18n-placeholder="newPasswordPlaceholder" placeholder="Değiştirmek istemiyorsanız boş bırakın" style="border-radius: 10px; font-size: 15px;">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" style="border-radius: 10px; font-size: 16px;" data-i18n="saveChanges">Değişiklikleri Kaydet</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="passengerSettingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
                <div class="modal-header border-0 bg-white pb-0 mt-2 px-4">
                    <h4 class="modal-title fw-bold text-dark d-flex align-items-center">
                        <i class="fas fa-cog text-secondary me-2"></i> <span data-i18n="settingsTitle">Sistem Ayarları</span>
                    </h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
                </div>
                <div class="modal-body p-4 pt-3">
                    <div class="form-check form-switch d-flex justify-content-between align-items-center mb-3 px-0">
                        <label class="form-check-label text-dark" for="set_emailNotify" style="font-size: 15px;" data-i18n="emailNotifications">E-posta Bildirimleri</label>
                        <input class="form-check-input ms-0 fs-5 shadow-none" type="checkbox" role="switch" id="set_emailNotify" style="cursor: pointer;">
                    </div>
                    
                    <hr class="text-muted opacity-25 my-3" style="margin-left: -1.5rem; margin-right: -1.5rem;">
                    
                    <div class="form-check form-switch d-flex justify-content-between align-items-center mb-3 px-0">
                        <label class="form-check-label text-dark" for="set_smsNotify" style="font-size: 15px;" data-i18n="smsNotifications">SMS Bilgilendirmesi</label>
                        <input class="form-check-input ms-0 fs-5 shadow-none" type="checkbox" role="switch" id="set_smsNotify" style="cursor: pointer;">
                    </div>
                    
                    <hr class="text-muted opacity-25 my-3" style="margin-left: -1.5rem; margin-right: -1.5rem;">
                    
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="text-dark" style="font-size: 15px;" data-i18n="currencyLabel">Para Birimi</span>
                        <select class="form-select w-auto border-0 text-primary fw-bold shadow-none p-0 pe-4" id="set_currency" style="cursor: pointer; font-size: 15px; background-color: transparent;">
                            <option value="TRY">TRY (₺)</option>
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="bilet.js"></script>
</body>
</html>
