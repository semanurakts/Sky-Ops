<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyOps - Giriş Portalı</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Scroll'u engelle */
            background-color: #0f172a;
        }

        /* --- SİNEMATİK ARKA PLAN ANİMASYONU --- */
        .bg-image {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            /* Yöntem A: Tarayıcı editörden bağımsız klasörü bulsun */
            background-image: url('images/bulten.jpeg') !important; 
            /* !important kuralı, o siyah rengin üstüne binmesini engeller */
            
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            z-index: 0;
            animation: slowZoom 25s infinite alternate ease-in-out;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* Arka planı biraz koyulaştırıp yazıları okunur kılmak için overlay */
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(15, 23, 42, 0.4) 100%);
            z-index: 1;
        }

        /* --- GLASSMORPHISM (BUZLU CAM) KARTI --- */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Dekoratif Işık Yansımaları */
        .glass-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            transform: rotate(30deg); pointer-events: none;
        }

        /* --- LOGO VE BAŞLIK --- */
        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: -1px;
            color: #ffffff;
        }
        .brand-logo i { color: #3b82f6; }

        /* --- YOLCU / PERSONEL GEÇİŞ BUTONU (TOGGLE) --- */
        .role-toggle {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50px;
            padding: 5px;
            display: flex;
            position: relative;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .role-btn {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-weight: 600;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .role-btn.active { color: #ffffff; }

        .toggle-slider {
            position: absolute;
            top: 5px; left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            background: #3b82f6;
            border-radius: 50px;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        /* --- FORM STİLLERİ --- */
        .form-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .form-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-floating { margin-bottom: 20px; }
        
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #3b82f6;
            color: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }
        .form-floating label { color: rgba(255, 255, 255, 0.6); }
        .form-control::placeholder { color: transparent; }

        .btn-login {
            background: #3b82f6;
            color: white;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            border: none;
            transition: all 0.3s;
            margin-top: 10px;
            font-size: 1.05rem;
        }
        .btn-login:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .forgot-link {
            color: #93c5fd;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .forgot-link:hover { color: #ffffff; }

        .register-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }
        .register-text a {
            color: #60a5fa;
            font-weight: 700;
            text-decoration: none;
        }
        .register-text a:hover { text-decoration: underline; }

        .login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    
    position: relative;
    z-index: 2; /* 🔥 EN KRİTİK SATIR */
}
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="login-container">
        <div class="glass-card">
            
            <div class="brand-logo">
                <i class="fas fa-plane-departure"></i> SkyOps
            </div>

            <div class="role-toggle" id="roleToggle">
                <div class="toggle-slider" id="toggleSlider"></div>
                <div class="role-btn active" id="btnPassenger" onclick="switchRole('passenger')">Yolcu Girişi</div>
                <div class="role-btn" id="btnEmployee" onclick="switchRole('employee')">Personel Girişi</div>
            </div>

            <div id="passengerForm" class="form-section active">
                <h5 class="fw-bold mb-4 text-center">Dünyayı Keşfetmeye Devam Et</h5>
                <form onsubmit="handlePassengerLogin(event)">
                    <div class="form-floating">
                        <input type="email" class="form-control" id="passEmail" placeholder="E-posta" required>
                        <label for="passEmail"><i class="fas fa-envelope me-2"></i>E-posta Adresi</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="passPassword" placeholder="Şifre" required>
                        <label for="passPassword"><i class="fas fa-lock me-2"></i>Şifre</label>
                    </div>
                    <div class="d-flex justify-content-end mb-3">
                        <a href="#" class="forgot-link">Şifremi Unuttum</a>
                    </div>
                    <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt me-2"></i>Giriş Yap</button>
                    
                    <div class="register-text">
                        Hesabın yok mu? <a href="#">Hemen Kayıt Ol</a>
                    </div>
                </form>
            </div>

            <div id="employeeForm" class="form-section">
                <h5 class="fw-bold mb-4 text-center">Operasyon Kontrol Merkezi</h5>
                <form onsubmit="handleEmployeeLogin(event)">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="empId" placeholder="Sicil No" required>
                        <label for="empId"><i class="fas fa-id-badge me-2"></i>Sicil Numarası</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="empPassword" placeholder="Şifre" required>
                        <label for="empPassword"><i class="fas fa-key me-2"></i>Sistem Şifresi</label>
                    </div>
                    <div class="d-flex justify-content-end mb-3">
                        <a href="#" class="forgot-link">IT Destek Birimi</a>
                    </div>
                    <button type="submit" class="btn-login" style="background: #10b981;"><i class="fas fa-user-shield me-2"></i>Sisteme Bağlan</button>
                    
                    <div class="register-text text-warning small mt-4">
                        <i class="fas fa-exclamation-triangle me-1"></i> Yetkisiz erişim denemeleri kayıt altına alınmaktadır.
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script>
        function switchRole(role) {
            const btnPass = document.getElementById('btnPassenger');
            const btnEmp = document.getElementById('btnEmployee');
            const slider = document.getElementById('toggleSlider');
            const formPass = document.getElementById('passengerForm');
            const formEmp = document.getElementById('employeeForm');

            if (role === 'passenger') {
                btnPass.classList.add('active');
                btnEmp.classList.remove('active');
                slider.style.transform = 'translateX(0)';
                slider.style.background = '#3b82f6'; // Mavi
                
                formEmp.classList.remove('active');
                setTimeout(() => formPass.classList.add('active'), 50);
            } else {
                btnEmp.classList.add('active');
                btnPass.classList.remove('active');
                slider.style.transform = 'translateX(100%)';
                slider.style.background = '#10b981'; // Yeşil
                
                formPass.classList.remove('active');
                setTimeout(() => formEmp.classList.add('active'), 50);
            }
        }

        function handlePassengerLogin(e) {
            e.preventDefault();
            window.location.href = 'yolcu.html';
        }

        function handleEmployeeLogin(e) {
            e.preventDefault();
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
